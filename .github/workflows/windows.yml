name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev pkg-config
      - name: Unit tests (jarvis-core)
        run: cargo test -p jarvis-core --no-default-features --features reqwest --lib

  voice-server:
    name: voice server and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (models are mocked)
        working-directory: tools/voice-server
        run: |
          pip install numpy pytest
          python -m pytest -q
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @("tools/voice-server/install.ps1", "installer/configure.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $bad++; $errors | ForEach-Object { "{0}:{1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message } } else { "$f OK" }
          }
          exit $bad

  windows:
    name: build (Windows x64)
    runs-on: windows-latest
    env:
      # baked into the binaries; the in-app updater compares it with version.json
      JARVIS_VERSION: 0.2.${{ github.run_number }}
      JARVIS_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        # vite generates .routify, so svelte-check (npm run build) is skipped here
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Tests on Windows
        run: cargo test -p jarvis-core --no-default-features --features reqwest --lib

      # separate invocations: building both at once unifies jarvis-core features
      # and makes jarvis-gui link against Vosk
      - name: Build jarvis-app
        run: cargo build --release -p jarvis-app

      - name: Build jarvis-gui
        run: cargo build --release -p jarvis-gui

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/Jarvis"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/jarvis-app.exe, target/release/jarvis-gui.exe $out
          # ONNX Runtime and other DLLs produced by the build
          Get-ChildItem target/release -Filter *.dll | Copy-Item -Destination $out
          Copy-Item lib/windows/amd64/*.dll $out

          New-Item -ItemType Directory -Force -Path "$out/resources" | Out-Null
          foreach ($d in "commands", "sound", "rustpotter", "keywords", "icons") {
            Copy-Item -Recurse "resources/$d" "$out/resources/$d"
          }
          # Russian speech model only: keeps the download small
          New-Item -ItemType Directory -Force -Path "$out/resources/vosk" | Out-Null
          Copy-Item -Recurse resources/vosk/vosk-model-small-ru-0.22 "$out/resources/vosk/"
          New-Item -ItemType Directory -Force -Path "$out/resources/models" | Out-Null

          Copy-Item -Recurse tools "$out/tools"
          Copy-Item crates/jarvis-core/assets/assistant.default.toml "$out/assistant.example.toml"
          Copy-Item docs/INSTALL-RU.md "$out/ИНСТРУКЦИЯ.md"
          Copy-Item LICENSE.txt $out

          Compress-Archive -Path $out -DestinationPath dist/Jarvis-windows-x64.zip -CompressionLevel Optimal
          Get-Item dist/Jarvis-windows-x64.zip | Select-Object Name, Length

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc /Qp "/DAppVersion=$env:JARVIS_VERSION" installer\jarvis.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/JarvisSetup.exe | Select-Object Name, Length
          @{ version = $env:JARVIS_VERSION; build = $env:JARVIS_BUILD; setup = "https://github.com/softlyfear/jarvis/releases/download/latest/JarvisSetup.exe" } |
            ConvertTo-Json | Set-Content -Encoding ascii dist/version.json
          Get-Content dist/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows-x64
          path: |
            dist/JarvisSetup.exe
            dist/Jarvis-windows-x64.zip
          retention-days: 14

      # a fixed "latest" pre-release, downloadable without a GitHub login
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: true
          make_latest: false
          body: |
            Версия ${{ env.JARVIS_VERSION }}, сборка из ветки master (${{ github.sha }}).
            **JarvisSetup.exe** — установщик: скачайте и запустите.
            Jarvis-windows-x64.zip — то же без установщика (распаковать в C:\Jarvis).
          files: |
            dist/JarvisSetup.exe
            dist/Jarvis-windows-x64.zip
            dist/version.json
