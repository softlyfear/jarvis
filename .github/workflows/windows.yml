name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev pkg-config
      - name: Unit tests (jarvis-core)
        run: cargo test -p jarvis-core --no-default-features --features reqwest --lib

  voice-server:
    name: voice server and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (models are mocked)
        working-directory: tools/voice-server
        run: |
          pip install numpy pytest
          python -m pytest -q
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @("tools/voice-server/install.ps1", "installer/configure.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $bad++; $errors | ForEach-Object { "{0}:{1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message } } else { "$f OK" }
          }
          exit $bad

  windows:
    name: build (Windows x64)
    runs-on: windows-latest
    env:
      # baked into the binaries; the in-app updater compares it with version.json
      JARVIS_VERSION: 0.2.${{ github.run_number }}
      JARVIS_BUILD: ${{ github.sha }}
      # speech recognition for AMD/Intel GPUs and CPUs (tools/voice-server)
      WHISPER_CPP_REF: v1.9.4
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v5

      # whisper.cpp server with the Vulkan backend: runs on any GPU vendor, falls back to the CPU
      - uses: actions/checkout@v5
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_CPP_REF }}
          path: whisper.cpp

      - name: Cache whisper.cpp build
        id: whispercpp-cache
        uses: actions/cache@v4
        with:
          path: whispercpp-dist
          key: whispercpp-${{ env.WHISPER_CPP_REF }}-vulkan-${{ env.VULKAN_VERSION }}-r1

      - name: Build whisper.cpp (Vulkan)
        if: steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\VulkanSDK.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"
          # GGML_NATIVE=OFF + all CPU variants: the runner's CPU must not decide which instructions users need
          cmake -S whisper.cpp -B wbuild -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON `
            -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=ON -DWHISPER_SDL2=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build wbuild --config Release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path whispercpp-dist | Out-Null
          Copy-Item wbuild/bin/Release/whisper-server.exe, wbuild/bin/Release/*.dll whispercpp-dist
          # MSVC runtime and OpenMP next to the exe: the user may not have the VC++ redistributable
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -match '^\d+\.' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          Get-ChildItem "$($redist.FullName)\x64\Microsoft.VC*.CRT\*.dll", "$($redist.FullName)\x64\Microsoft.VC*.OpenMP\*.dll" |
            Copy-Item -Destination whispercpp-dist
          Get-ChildItem whispercpp-dist | Select-Object Name, Length

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: whisper.cpp smoke test (CPU, test model)
        shell: pwsh
        working-directory: tools/voice-server
        run: |
          python -m pip install -q numpy
          python -c "import numpy as np, server; r = server.WhisperCppRecognizer(r'${{ github.workspace }}\whisper.cpp\models\for-tests-ggml-tiny.bin', exe=r'${{ github.workspace }}\whispercpp-dist\whisper-server.exe', ready_timeout=120); print('OK', r.description, repr(r.transcribe_samples(np.zeros(16000, dtype=np.float32)))); r.stop()"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        # vite generates .routify, so svelte-check (npm run build) is skipped here
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Tests on Windows
        run: cargo test -p jarvis-core --no-default-features --features reqwest --lib

      # separate invocations: building both at once unifies jarvis-core features
      # and makes jarvis-gui link against Vosk
      - name: Build jarvis-app
        run: cargo build --release -p jarvis-app

      - name: Build jarvis-gui
        run: cargo build --release -p jarvis-gui

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/Jarvis"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/jarvis-app.exe, target/release/jarvis-gui.exe $out
          # ONNX Runtime and other DLLs produced by the build
          Get-ChildItem target/release -Filter *.dll | Copy-Item -Destination $out
          Copy-Item lib/windows/amd64/*.dll $out

          New-Item -ItemType Directory -Force -Path "$out/resources" | Out-Null
          foreach ($d in "commands", "sound", "rustpotter", "keywords", "icons") {
            Copy-Item -Recurse "resources/$d" "$out/resources/$d"
          }
          # Russian speech model only: keeps the download small
          New-Item -ItemType Directory -Force -Path "$out/resources/vosk" | Out-Null
          Copy-Item -Recurse resources/vosk/vosk-model-small-ru-0.22 "$out/resources/vosk/"
          New-Item -ItemType Directory -Force -Path "$out/resources/models" | Out-Null

          Copy-Item -Recurse tools "$out/tools"
          Copy-Item -Recurse whispercpp-dist "$out/tools/voice-server/whispercpp"
          Copy-Item crates/jarvis-core/assets/assistant.default.toml "$out/assistant.example.toml"
          Copy-Item docs/INSTALL-RU.md "$out/ИНСТРУКЦИЯ.md"
          Copy-Item LICENSE.txt $out

          Compress-Archive -Path $out -DestinationPath dist/Jarvis-windows-x64.zip -CompressionLevel Optimal
          Get-Item dist/Jarvis-windows-x64.zip | Select-Object Name, Length

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc /Qp "/DAppVersion=$env:JARVIS_VERSION" installer\jarvis.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/JarvisSetup.exe | Select-Object Name, Length
          @{ version = $env:JARVIS_VERSION; build = $env:JARVIS_BUILD; setup = "https://github.com/softlyfear/jarvis/releases/download/latest/JarvisSetup.exe" } |
            ConvertTo-Json | Set-Content -Encoding ascii dist/version.json
          Get-Content dist/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-windows-x64
          path: |
            dist/JarvisSetup.exe
            dist/Jarvis-windows-x64.zip
          retention-days: 14

      # a fixed "latest" pre-release, downloadable without a GitHub login
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: true
          make_latest: false
          body: |
            Версия ${{ env.JARVIS_VERSION }}, сборка из ветки master (${{ github.sha }}).
            **JarvisSetup.exe** — установщик: скачайте и запустите.
            Jarvis-windows-x64.zip — то же без установщика (распаковать в C:\Jarvis).
          files: |
            dist/JarvisSetup.exe
            dist/Jarvis-windows-x64.zip
            dist/version.json
