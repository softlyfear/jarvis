# Assistant's own reactions (recorded Jarvis phrases) and lifecycle.

[[commands]]
id = "thanks"
type = "voice"
sounds.ru = ["thanks"]
phrases.ru = ["спасибо", "молодец", "респект", "ты супер", "отличная работа", "ты крут", "ты большой молодец"]
phrases.en = ["thank you", "thanks", "good job"]

[[commands]]
id = "insult"
type = "voice"
sounds.ru = ["stupid"]
phrases.ru = ["ты дурак", "ты глупый", "ты тупой"]

[[commands]]
id = "joke"
type = "voice"
sounds.ru = ["joke1", "joke2", "joke3", "joke4", "joke5", "joke6", "joke7", "joke8"]
phrases.ru = ["расскажи анекдот", "рассмеши", "пошути", "расскажи шутку", "развесели меня", "хочу анекдот"]

[[commands]]
id = "stop_listening"
type = "stop_chaining"
sounds.ru = ["ok1"]
phrases.ru = ["всё", "хватит", "не слушай", "перестань слушать", "отдыхай", "на этом всё", "хватит слушать"]
phrases.en = ["that's all", "stop listening", "enough"]

[[commands]]
id = "terminate"
type = "terminate"
phrases.ru = ["выключись", "вырубись", "закройся", "отключись", "заверши свою работу", "выгрузи себя из памяти"]
phrases.en = ["turn yourself off", "shut yourself down", "exit"]
