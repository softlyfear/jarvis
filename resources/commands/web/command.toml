# Searches on sites: opens the results page in the browser.

[[commands]]
id = "youtube_search"
type = "action"
action = "site_search"
args = { site = "youtube" }
phrases.ru = ["включи на ютубе {query}", "найди на ютубе {query}", "покажи на ютубе {query}", "ютуб {query}", "поставь на ютубе {query}"]

[[commands]]
id = "music_search"
type = "action"
action = "site_search"
args = { site = "music" }
phrases.ru = ["включи песню {query}", "поставь песню {query}", "найди песню {query}", "включи в яндекс музыке {query}", "найди в яндекс музыке {query}", "включи музыку {query}"]

[[commands]]
id = "maps_search"
