# Installed Steam games (found automatically), then shortcuts.
# Nicknames ("кс", "дота") are set in [games] of assistant.toml.

[[commands]]
id = "launch_game"
type = "action"
action = "launch_game"
sounds.ru = ["ok1", "ok2", "ok3", "ok4"]
sounds.en = ["ok1", "ok2", "ok3"]
phrases.ru = [
    "запусти игру {game}",
    "включи игру {game}",
    "открой игру {game}",
    "поиграем в {game}",
    "хочу поиграть в {game}",
    "давай поиграем в {game}",
    "запусти {game}",
]
phrases.en = ["launch game {game}", "play {game}", "let's play {game}"]
