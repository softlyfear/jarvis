[voice]
id = "jarvis-og"
name = "Jarvis OG"
author = "Abraham (Priler)"
languages = ["ru"]

[reactions.ru]
# app startup
greet = ["run"]

# wake word detected
reply = ["reply1", "reply2", "reply3"]

# command executed
ok = ["ok1", "ok2", "ok3", "ok4"]

# command not found
not_found = ["not_found"]

# thanks
thanks = ["thanks"]

# error
error = []

# goodbye
goodbye = ["off"]

# Voice clone reference for the voice server (F5-TTS): clips of this pack and their exact
# text, at most 12 seconds together
[tts.ru]
reference = ["not_found", "ok3", "stupid", "thanks"]
text = "Чего вы пытаетесь добиться, сэр? Запрос выполнен, сэр. Очень тонкое замечание, сэр. Всегда к вашим услугам, сэр."
