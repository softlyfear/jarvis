[voice]
id = "jarvis-howdy"
name = "Jarvis Howdy"
author = "Abraham (Priler)"
languages = ["ru"]

[reactions.ru]
# app startup
greet = ["run", "ready"]

# wake word detected
reply = ["reply1", "reply2", "reply3"]

# command executed
ok = ["ok1", "ok2", "ok3", "ok4"]

# command not found
not_found = ["not_found"]

# thanks
thanks = ["thanks"]

# error
error = []

# goodbye
goodbye = ["off"]

# Voice clone reference for the voice server (F5-TTS): clips of this pack and their exact
# text, at most 12 seconds together
[tts.ru]
reference = ["joke1", "joke4", "game_mode"]
text = "Я бы пошутил про химию, но, боюсь, реакции не будет, сэр. Что треугольник сказал кругу? Катись отсюда. Мы перешли в игровой режим. Приятной игры, сэр."
