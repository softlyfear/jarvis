# ============================================================
#  Настройки ассистента (LLM, голос, программы, безопасность)
#  Файл создаётся при первом запуске. После правки перезапустите Джарвиса.
# ============================================================

[llm]
# Нейросеть подключается, только когда встроенные команды не поняли фразу.
enabled = true
timeout_secs = 20
max_tokens = 400
temperature = 0.3
# Сколько минут помнить разговор
memory_minutes = 5
# Дополнительные указания для нейросети (например, как обращаться к хозяйке)
extra_prompt = "Обращайся к пользователю «мисс», отвечай коротко и с лёгкой иронией, как Джарвис."

# Нейросеть — Google Gemini. Ключи (можно несколько, с разных аккаунтов):
#   https://aistudio.google.com/apikey   (из России — с включённым VPN)
# Ключи чередуются; ключ, упёршийся в лимит (429) или отвергнутый (401/403),
# временно пропускается.
#
# models = ["auto"] — Джарвис сам спрашивает у Google список моделей и выбирает
# быстрые бесплатные (flash, затем flash-lite), стабильные раньше preview.
# Можно указать и конкретные: ["gemini-2.5-flash", "auto"] — сначала эта, потом автоподбор.

[[llm.providers]]
name = "gemini"
enabled = true
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
models = ["auto"]
keys = []

# Другие OpenAI-совместимые провайдеры (Groq, OpenRouter, локальная Ollama)
# добавляются таким же блоком [[llm.providers]] с base_url, models и keys.

[voice_server]
# Голосовой сервер (Whisper + клон голоса) запускается вместе с Джарвисом,
# если он установлен через tools\voice-server\setup.bat.
autostart = true
# Дополнительные параметры: ["--no-tts"] — только распознавание (меньше видеопамяти),
# ["--no-stt"] — только голос, ["--whisper-model", "medium"] — модель поменьше
args = []
health_url = "http://127.0.0.1:5055/health"

[stt]
# Распознавание команд после слова «Джарвис»:
#   "whisper" — нейросеть Whisper через локальный голосовой сервер (tools/voice-server): на видеокарте NVIDIA, AMD или Intel.
#               Если сервер не запущен, команды распознаёт встроенный Vosk.
#   "vosk"    — только встроенный Vosk (быстро, без видеокарты, но хуже понимает)
engine = "whisper"
whisper_url = "http://127.0.0.1:5055/stt"
whisper_timeout_secs = 10
language = "ru"
min_audio_ms = 300
retry_after_secs = 30

[tts]
# Как озвучивать ответы нейросети:
#   "sapi" — встроенный голос Windows (бесплатно, без интернета)
#   "http" — локальный сервер клонированного голоса (tools/voice-server)
#   "none" — не озвучивать, только уведомление
backend = "sapi"
sapi_voice = ""      # часть имени голоса, например "Irina" или "Pavel"; пусто = по умолчанию
sapi_rate = 1        # скорость -10..10
http_url = "http://127.0.0.1:5055/tts"
http_timeout_secs = 30
http_fallback_sapi = true

[safety]
# Спрашивать «да/нет» перед удалением файлов, выключением и перезагрузкой
confirm_dangerous = true
confirm_timeout_secs = 20
# Искать и удалять файлы можно только в этих папках (удаление — в Корзину)
allowed_dirs = [
    "%USERPROFILE%\\Desktop",
    "%USERPROFILE%\\Downloads",
    "%USERPROFILE%\\Documents",
    "%USERPROFILE%\\Pictures",
    "%USERPROFILE%\\Music",
    "%USERPROFILE%\\Videos",
]

# Как открывать программы по названию: "название" = "путь, ярлык, ссылка или URI".
# Программы из меню «Пуск» и игры Steam находятся автоматически, сюда — только особые случаи.
[apps]
"браузер" = "https://ya.ru"
"блокнот" = "notepad.exe"
"калькулятор" = "calc.exe"
"проводник" = "explorer.exe"
"диспетчер задач" = "taskmgr.exe"
"параметры" = "ms-settings:"
"настройки" = "ms-settings:"
"панель управления" = "control.exe"
"командная строка" = "cmd.exe"
"пейнт" = "mspaint.exe"
"стим" = "steam://open/main"
"дискорд" = "discord://"
"телеграм" = "tg://"
"спотифай" = "spotify:"
"ютуб" = "https://www.youtube.com"
"вконтакте" = "https://vk.com"
"вк" = "https://vk.com"
"почта" = "https://mail.yandex.ru"
"яндекс музыка" = "https://music.yandex.ru"
"карты" = "https://yandex.ru/maps"
"переводчик" = "https://translate.yandex.ru"

# Как закрывать программы: "название" = ["имена процессов без .exe"]
[processes]
"браузер" = ["chrome", "msedge", "firefox", "browser", "opera", "yandex"]
"хром" = ["chrome"]
"стим" = ["steam"]
"дискорд" = ["discord"]
"телеграм" = ["telegram"]
"блокнот" = ["notepad"]
"калькулятор" = ["calculatorapp", "calculator"]
"пейнт" = ["mspaint"]
"ворд" = ["winword"]
"эксель" = ["excel"]
"спотифай" = ["spotify"]
"диспетчер задач" = ["taskmgr"]

# Папки по названию
[folders]
"загрузки" = "%USERPROFILE%\\Downloads"
"документы" = "%USERPROFILE%\\Documents"
"рабочий стол" = "%USERPROFILE%\\Desktop"
"картинки" = "%USERPROFILE%\\Pictures"
"изображения" = "%USERPROFILE%\\Pictures"
"скриншоты" = "%USERPROFILE%\\Pictures\\Screenshots"
"музыка" = "%USERPROFILE%\\Music"
"видео" = "%USERPROFILE%\\Videos"

# Как называть игры голосом: "как говорите" = "название в Steam" или его appid.
# Установленные игры Steam находятся сами, сюда — сокращения и прозвища.
