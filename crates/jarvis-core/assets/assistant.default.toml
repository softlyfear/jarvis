# ============================================================
#  Настройки ассистента (LLM, голос, программы, безопасность)
#  Файл создаётся при первом запуске. После правки перезапустите Джарвиса.
# ============================================================

[assistant]
# Как Джарвис к вам обращается: "сэр", "мисс" или любое слово (например, имя).
# С голосовым сервером отклики Джарвиса («Слушаю, …», «Выполнено, …») тоже звучат с этим обращением.
address = "сэр"

[llm]
# Нейросеть подключается, только когда встроенные команды не поняли фразу.
enabled = true
timeout_secs = 20
max_tokens = 400
# Сколько нейросеть думает перед ответом: "none" — отвечает сразу (быстрее всего), "low", "medium";
# "" — как решит сама модель. Размышления расходуют max_tokens: с "low", "medium" или ""
# поднимите max_tokens до 2000–4000, иначе ответ обрежется или не придёт
reasoning = "none"
# Сколько минут помнить разговор
memory_minutes = 5
# Дополнительные указания для нейросети (обращение задаётся в [assistant] выше)
extra_prompt = "Отвечай коротко и с лёгкой иронией, как Джарвис."

# Только бесплатные модели OpenRouter, даже если ключ задан. Без ключа они тоже не отвечают.
free_only = false

# Нейросеть — шлюз OpenRouter (https://openrouter.ai).
# Ключ «sk-or-…»: openrouter.ai → Keys. Без ключа шлюз не отвечает.
# Платная модель — DeepSeek V4 Flash latest.
# Бесплатные модели (Nemotron 3 Ultra и другие) используют тот же ключ:
#   до 50 запросов в сутки, пока на счету не было покупки на $10, затем до 1000.
#   Отрицательный баланс отвечает 402 и на бесплатных моделях.
# Кончились деньги (402) — ключ платных моделей отдыхает час, затем пробуются бесплатные.
# models — по порядку; id моделей как на openrouter.ai/models.
#
# Из России без VPN можно вместо этого взять Polza AI (https://polza.ai, оплата рублями,
# DeepSeek V4 Flash): ключ «sk-polza-…» в окне настроек, и блок Polza встанет выше этого.
# Старый блок Kilo при запуске переключается на OpenRouter. Ключ eyJ… от Kilo не подходит.

[[llm.providers]]
name = "openrouter"
enabled = true
base_url = "https://openrouter.ai/api/v1"
models = ["~deepseek/deepseek-v4-flash-latest"]
keys = []

# Другие OpenAI-совместимые провайдеры (локальная Ollama и т. п.) добавляются
# таким же блоком [[llm.providers]] с base_url, models и keys (keyless = true — без ключа).
# Отключить бесплатные модели OpenRouter: free_fallback = false в разделе [llm].

[voice_server]
# Голосовой сервер (Whisper + клон голоса) запускается вместе с Джарвисом,
# если он установлен через tools\voice-server\setup.bat.
autostart = true
# Дополнительные параметры: ["--no-tts"] — только распознавание (меньше видеопамяти),
# ["--no-stt"] — только голос, ["--whisper-model", "medium"] — модель поменьше
args = []
health_url = "http://127.0.0.1:5055/health"

[stt]
# Команды распознаёт голосовой сервер (GigaAM Multilingual: русский и английский);
# Vosk ловит слово активации и подхватывает распознавание, если сервер недоступен.
whisper_url = "http://127.0.0.1:5055/stt"
whisper_timeout_secs = 10
language = "ru"
min_audio_ms = 300
retry_after_secs = 30

[vision]
# Посмотреть на экран («Джарвис, что у меня на экране?», «объясни эту ошибку»): снимок экрана
# уходит бесплатной модели Google только по такой просьбе. Ключ — aistudio.google.com → Get API key.
# Единственная модель — gemini-flash-lite-latest, актуальная Flash-Lite у Google.
# Минимальные рассуждения; ответ ожидается до 25 секунд, соединение — до 5 секунд.
# Из России Google API работает только через VPN. Пусто — зрение выключено.
google_key = ""

[tts]
# Jarvis New: F5 ESpeech RL-V2 на NVIDIA CUDA или поддерживаемой AMD ROCm, 16 шагов и RUAccent.
# "http" — локальный голосовой сервер, "none" — только уведомление.
backend = "http"
http_url = "http://127.0.0.1:5055/tts"
http_timeout_secs = 30
# Сказать «Джарвис», пока он говорит длинный ответ, — он замолчит и выслушает команду.
# Если с колонками он сам себя обрывает, выключите (false) или говорите через гарнитуру.
barge_in = true

[safety]
# Спрашивать «да/нет» перед удалением файлов, выключением и перезагрузкой
confirm_dangerous = true
confirm_timeout_secs = 20
# Искать и удалять файлы можно только в этих папках (удаление — в Корзину)
allowed_dirs = [
    "%USERPROFILE%\\Desktop",
    "%USERPROFILE%\\Downloads",
    "%USERPROFILE%\\Documents",
    "%USERPROFILE%\\Pictures",
    "%USERPROFILE%\\Music",
    "%USERPROFILE%\\Videos",
]

# Как открывать программы по названию: "название" = "путь, ярлык, ссылка или URI".
# Программы из меню «Пуск» и игры Steam находятся автоматически, сюда — только особые случаи.
[apps]
"браузер" = "https://ya.ru"
"блокнот" = "notepad.exe"
"калькулятор" = "calc.exe"
"проводник" = "explorer.exe"
"диспетчер задач" = "taskmgr.exe"
"параметры" = "ms-settings:"
"настройки" = "ms-settings:"
"панель управления" = "control.exe"
"командная строка" = "cmd.exe"
"пейнт" = "mspaint.exe"
"стим" = "steam://open/main"
"дискорд" = "discord://"
"телеграм" = "tg://"
"спотифай" = "spotify:"
"ютуб" = "https://www.youtube.com"
"вконтакте" = "https://vk.com"
"вк" = "https://vk.com"
"почта" = "https://mail.yandex.ru"
"яндекс музыка" = "https://music.yandex.ru"
"карты" = "https://yandex.ru/maps"
"переводчик" = "https://translate.yandex.ru"

# Как закрывать программы: "название" = ["имена процессов без .exe"]
[processes]
"браузер" = ["chrome", "msedge", "firefox", "browser", "opera", "yandex"]
"хром" = ["chrome"]
"стим" = ["steam"]
"дискорд" = ["discord"]
"телеграм" = ["telegram"]
"блокнот" = ["notepad"]
"калькулятор" = ["calculatorapp", "calculator"]
"пейнт" = ["mspaint"]
"ворд" = ["winword"]
"эксель" = ["excel"]
"спотифай" = ["spotify"]
"диспетчер задач" = ["taskmgr"]

# Папки по названию
[folders]
"загрузки" = "%USERPROFILE%\\Downloads"
"документы" = "%USERPROFILE%\\Documents"
"рабочий стол" = "%USERPROFILE%\\Desktop"
"картинки" = "%USERPROFILE%\\Pictures"
"изображения" = "%USERPROFILE%\\Pictures"
"скриншоты" = "%USERPROFILE%\\Pictures\\Screenshots"
"музыка" = "%USERPROFILE%\\Music"
"видео" = "%USERPROFILE%\\Videos"

# Как называть игры голосом: "как говорите" = "название в Steam" или его appid.
# Установленные игры Steam находятся сами, сюда — сокращения и прозвища.
[games]
"кс" = "Counter-Strike 2"
"контра" = "Counter-Strike 2"
"контр страйк" = "Counter-Strike 2"
"дота" = "Dota 2"
"гта" = "Grand Theft Auto V"
"пабг" = "PUBG: BATTLEGROUNDS"
"пубг" = "PUBG: BATTLEGROUNDS"
"раст" = "Rust"
"апекс" = "Apex Legends"
"варфейс" = "Warface"
"симсы" = "The Sims 4"
"симс" = "The Sims 4"
"стардью" = "Stardew Valley"
"террария" = "Terraria"
"геншин" = "Genshin Impact"
