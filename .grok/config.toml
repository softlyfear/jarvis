# Project settings Grok actually reads: mcp_servers, plugins, permission, mcp.
# Shell environment, including DOCS_RS, is not applied from this file.

[permission]
allow = [
  "Read",
  "Edit",
  "Write",
  "Grep",
  "Glob",
  "WebSearch",
  "Bash(ls *)",
  "Bash(cat *)",
  "Bash(grep *)",
  "Bash(find *)",
  "Bash(head *)",
  "Bash(tail *)",
  "Bash(wc *)",
  "Bash(diff *)",
  "Bash(sort *)",
  "Bash(du *)",
  "Bash(mkdir *)",
  "Bash(cp *)",
  "Bash(sed *)",
  "Bash(awk *)",
  "Bash(echo *)",
  "Bash(which *)",
  "Bash(python3 *)",
  "Bash(git *)",
  "Bash(cargo check *)",
  "Bash(cargo build *)",
  "Bash(cargo test *)",
  "Bash(cargo clippy *)",
  "Bash(cargo tree *)",
  "Bash(cargo metadata *)",
  "Bash(rustup *)",
  "Bash(npm ci *)",
  "Bash(npm install *)",
  "Bash(npm run *)",
  "Bash(luac *)",
  "Bash(bash -n *)",
  "Bash(rg *)",
  "Bash(npx svelte-check *)",
  "Bash(gh release view *)",
  "Bash(gh run list *)",
  "Bash(gh run view *)",
  "Bash(gh run download *)",
  "Bash(gh run watch *)",
  "Bash(uv run *)",
]
deny = [
  "Bash(rm -rf /)",
  "Bash(rm -rf ~)",
  "Bash(rm -rf .grok)",
  "Bash(rm -rf .grok/*)",
  "Bash(sudo rm -rf /)",
  "Bash(sudo rm -rf ~)",
  "Bash(rm -rf --no-preserve-root *)",
  "Bash(sudo rm -rf --no-preserve-root *)",
]

[mcp_servers.serena]
command = "bash"
args = ["-c", "exec python3 \"$(git rev-parse --show-toplevel)/.codex/mcp/launch.py\" \"$1\"", "jarvis-mcp", "serena"]
startup_timeout_sec = 90
tool_timeout_sec = 120

[mcp_servers.hugging_face_hub]
url = "https://huggingface.co/mcp"
startup_timeout_sec = 60
tool_timeout_sec = 90
